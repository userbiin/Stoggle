server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://stoogle_loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: stoogle-api
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            logger: logger
      - labels:
          level:
          event:
          logger:
    static_configs:
      - targets:
          - localhost
        labels:
          job: stoogle-api
          __path__: /logs/stoogle-api.log
